name: dsh-reliability-plugin

on:
  push:
    paths:
      - "packages/**"
      - "fixtures/**"
      - "examples/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/test.yml"
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm install
      - name: Offline tests (no API key)
        run: npm test
        env:
          # 明确无 key：离线测试不得依赖真实模型
          DEEPSEEK_API_KEY: ""
